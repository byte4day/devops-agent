[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-agent"
version = "0.1.1"
description = "A safety-conscious DevOps support package for AI coding assistants"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "DevOps Agent contributors"}]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
devops-agent = "devops_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101"]
